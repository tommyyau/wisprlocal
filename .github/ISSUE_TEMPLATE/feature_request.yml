name: Feature request
description: Suggest an idea for WisprLocal
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        WisprLocal stays fully offline for dictation, so ideas that need a cloud service or an account are unlikely to be accepted. Everything else is welcome.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, e.g. "When I dictate code comments, ..."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
  - type: checkboxes
    id: offline
    attributes:
      label: Offline
      options:
        - label: This works without sending audio or text off my Mac.
